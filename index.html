<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شات بوت ذكي — محرّر</title>
  <style>
    :root {
      --main-color: #00ff00;
      --bg-color: #050000;
      --panel-bg: rgba(0, 20, 0, 0.85);
      --muted: #666;
      --dark-green: #003300;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background-color: var(--bg-color);
      color: var(--main-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-shadow: 0 0 5px var(--main-color);
    }

    .bg-grid { position: fixed; inset: 0; background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, rgba(0,0,0,0.95) 100%); z-index: -1; }

    header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--main-color);
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 18px; letter-spacing: 2px; }
    header nav { display: flex; gap: 8px; align-items: center; }
    .btn { background: var(--main-color); color:#000; border:none; padding:8px 12px; font-weight:600; cursor:pointer; border-radius:4px; }
    .ghost { background: transparent; border:1px solid var(--main-color); color:var(--main-color); }
    .btn:hover { opacity: 0.8; }

    main { display: flex; flex-direction: column; gap: 0; padding: 0; flex: 1; overflow: hidden; }

    /* Chat container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-bottom: 1px solid var(--main-color);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message.bot {
      flex-direction: row;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid var(--main-color);
    }

    .message.bot .message-avatar {
      background: rgba(0, 255, 0, 0.3);
      border: 2px solid var(--main-color);
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 6px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.user .message-bubble {
      background: rgba(0, 255, 0, 0.15);
      border: 1px solid rgba(0, 255, 0, 0.3);
      color: var(--main-color);
    }

    .message.bot .message-bubble {
      background: rgba(0, 255, 0, 0.08);
      border: 1px solid rgba(0, 255, 0, 0.5);
      color: var(--main-color);
    }

    .message.bot .message-bubble strong {
      color: #00ff00;
    }

    /* Input area */
    .chat-input-area {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--main-color);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #messageInput {
      flex: 1;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      border-radius: 4px;
      font-size: 14px;
      resize: none;
      max-height: 100px;
    }

    #messageInput::placeholder {
      color: var(--muted);
    }

    #messageInput:focus {
      outline: none;
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
    }

    .send-btn {
      padding: 10px 16px;
      align-self: center;
    }

    .status-bar { 
      padding: 10px 16px; 
      border-top:1px solid var(--main-color); 
      background: var(--panel-bg); 
      font-size: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--main-color);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    footer { padding:8px 16px; font-size:11px; color:var(--muted); }

    :focus { outline: 2px solid rgba(0, 255, 0, 0.3); outline-offset: 2px; }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(0, 255, 0, 0.05);
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 0, 0.3);
      border-radius: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header role="banner">
    <h1>🤖 BOT-CHAT — بوت ذكي أخضر</h1>
    <nav>
      <button id="clearChat" class="btn ghost">مسح</button>
    </nav>
  </header>

  <main>
    <section class="chat-container">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="نقاش الدردشة"></div>
    </section>
  </main>

  <div class="chat-input-area">
    <textarea id="messageInput" placeholder="اكتب كود أو سؤال الآن..." aria-label="حقل الإدخال" rows="1"></textarea>
    <button id="sendBtn" class="btn send-btn">أرسل ➤</button>
  </div>

  <div class="status-bar" role="contentinfo">
    <span>STATUS: <span id="status-text" aria-live="polite">READY</span></span>
    <span>MODE: AI-CHAT</span>
  </div>

  <footer>بوت ذكي يرد عليك في الحال. اكتب أي سؤال أو كود!</footer>

  <script>
    // AI responses - نسخة محسنة مع ذكاء بسيط
    const responses = {
      hello: "السلام عليكم! 👋 كيفك أنت؟ أنا بوت أخضر جاهز باش نساعدك!",
      hi: "مرحبا! 😊 شنوّ أخبارك؟ شنوّ اللي باش نساعدك فيه?",
      code: "عندك كود؟ 💻 نجم نقرا فيه وننشري لك التصحيح!",
      help: "بنّاء عليك شنوّ اللي تحتاج؟\n- اكتب أي سؤال عام\n- شارك كود تحتاج تصحيحه\n- اسأل عن البرمجة",
      javascript: "JavaScript؟ 🎯 لغة ديالة الويب زعمة! أنا فاهم فيها كويس. شنوّ المشكلة?",
      python: "Python؟ 🐍 لغة قوية! اكتب الكود وأنا نحاول نساعدك فيه.",
      html: "HTML؟ 🏗️ زعمة بناء الصفحات! تحتاج حاجة معينة?",
      css: "CSS؟ 🎨 تنسيق وألوان! أنا فاهم الأنماط والتصاميم.",
      bug: "وقعت في باگ؟ 🐛 حط لي الكود والرسالة الحمراء وأنا نقول لك الحل!",
      error: "في خطأ؟ 🔴 لا تقلق، نجم أساعدك! حط لي الرسالة الدقيقة.",
      thanks: "العفو! 😊 أنا هنا باش ما حتاش شي!",
      bye: "مع السلامة! 👋 باش تحتاج شي حاجة أخرى ؟",
      default: "حاصل بالضبط! 💚 قول لي الحاجة بالضبط وأنا نحاول نفهمك أحسن!"
    };

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearChat');
    const statusText = document.getElementById('status-text');

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // Send message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      // Add user message
      addMessage(text, 'user');
      messageInput.value = '';
      messageInput.style.height = 'auto';

      // Bot typing indicator
      showTypingIndicator();
      statusText.innerText = 'THINKING...';

      // Simulate processing delay
      setTimeout(() => {
        const response = generateResponse(text);
        removeTypingIndicator();
        addMessage(response, 'bot');
        statusText.innerText = 'READY';
        // Auto scroll
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 800 + Math.random() * 700);
    }

    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = sender === 'user' ? 'أنت' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = text;

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      chatMessages.appendChild(messageDiv);
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = '🤖';

      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<span></span><span></span><span></span>';

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(typing);
      chatMessages.appendChild(messageDiv);
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    function generateResponse(userText) {
      const lower = userText.toLowerCase();

      // Search for keywords
      for (const [key, response] of Object.entries(responses)) {
        if (lower.includes(key)) {
          return response;
        }
      }

      // If it looks like code, give code response
      if (lower.includes('{') || lower.includes('[') || lower.includes('function') || lower.includes('const')) {
        return "أنا شايف الكود! 💻 حط لي المشكلة اللي واجهة بالضبط وأنا نساعدك!";
      }

      // Random encouragement
      const encouragements = [
        "هذا سؤال حلو! 🤔 فكرة كويسة - واصل!",
        "👍 راني شايف وجهة نظرك!",
        "مشكل حقيقي! 💚 نجم نشتغل عليه!",
        "ممتاز! 🎯 شنوّ التفاصيل الكاملة?",
        "لله الحمد على الأفكار! 📝 زيد قول لي شي حاجة?"
      ];
      return encouragements[Math.floor(Math.random() * encouragements.length)];
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    clearBtn.addEventListener('click', () => {
      chatMessages.innerHTML = '';
      statusText.innerText = 'CLEARED';
      setTimeout(() => { statusText.innerText = 'READY'; }, 1000);
      messageInput.focus();
    });

    // Welcome message
    window.addEventListener('load', () => {
      addMessage("السلام عليكم! 👋 أنا بوت ذكي أخضر! اكتب أي سؤال أو كود وأنا نرد عليك في الحال. شنوّ اللي بديك?", 'bot');
      messageInput.focus();
    });
  </script>
</body>
</html>
