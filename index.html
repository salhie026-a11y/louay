<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLY Louay — شات بوت ذكي</title>
  <style>
    :root {
      --main-color: #00ff00;
      --bg-color: #050000;
      --panel-bg: rgba(0, 20, 0, 0.85);
      --muted: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background-color: var(--bg-color);
      color: var(--main-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-shadow: 0 0 5px var(--main-color);
    }

    .bg-grid { position: fixed; inset: 0; background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, rgba(0,0,0,0.95) 100%); z-index: -1; }

    /* LOGIN SCREEN */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      z-index: 100;
    }

    #loginScreen.hidden {
      display: none;
    }

    .login-box {
      background: var(--panel-bg);
      border: 2px solid var(--main-color);
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    .login-box h2 {
      font-size: 20px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .login-box p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #000;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      font-size: 16px;
      text-align: center;
      letter-spacing: 3px;
      border-radius: 4px;
    }

    .login-box input:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--main-color);
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      transition: opacity 0.2s;
    }

    .login-box button:hover {
      opacity: 0.8;
    }

    .error {
      color: #ff6666;
      font-size: 12px;
      display: none;
    }

    .error.show {
      display: block;
    }

    /* CHAT SCREEN */
    header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--main-color);
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 18px; letter-spacing: 2px; }
    header nav { display: flex; gap: 8px; align-items: center; }
    .btn { background: var(--main-color); color:#000; border:none; padding:8px 12px; font-weight:600; cursor:pointer; border-radius:4px; }
    .ghost { background: transparent; border:1px solid var(--main-color); color:var(--main-color); }
    .btn:hover { opacity: 0.8; }

    main { display: flex; flex-direction: column; gap: 0; padding: 0; flex: 1; overflow: hidden; }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message.bot {
      flex-direction: row;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      font-size: 16px;
    }

    .message.user .message-avatar {
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid var(--main-color);
    }

    .message.bot .message-avatar {
      background: rgba(0, 255, 0, 0.3);
      border: 2px solid var(--main-color);
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 6px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.user .message-bubble {
      background: rgba(0, 255, 0, 0.15);
      border: 1px solid rgba(0, 255, 0, 0.3);
      color: var(--main-color);
    }

    .message.bot .message-bubble {
      background: rgba(0, 255, 0, 0.08);
      border: 1px solid rgba(0, 255, 0, 0.5);
      color: var(--main-color);
    }

    .chat-input-area {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--main-color);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #messageInput {
      flex: 1;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      border-radius: 4px;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      font-family: 'Courier New', Courier, monospace;
    }

    #messageInput::placeholder {
      color: var(--muted);
    }

    #messageInput:focus {
      outline: none;
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
    }

    .send-btn {
      padding: 10px 16px;
    }

    .status-bar { 
      padding: 10px 16px; 
      border-top:1px solid var(--main-color); 
      background: var(--panel-bg); 
      font-size: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 5px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--main-color);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    footer { padding:8px 16px; font-size:11px; color:var(--muted); }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(0, 255, 0, 0.05);
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 0, 0.3);
      border-radius: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 ONLY Louay</h2>
      <p>حط الكود بتاعك باش تدخل للشات</p>
      <input type="password" id="codeInput" placeholder="الكود..." maxlength="5" inputmode="numeric" />
      <button id="loginBtn">دخول</button>
      <div id="error" class="error">الكود غالط! عاود جرّب 🚫</div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <header id="chatHeader" style="display: none;">
    <h1>💚 ONLY Louay</h1>
    <nav>
      <button id="logoutBtn" class="btn ghost">خروج</button>
    </nav>
  </header>

  <main id="chatMain" style="display: none;">
    <section class="chat-container">
      <div class="chat-messages" id="chatMessages"></div>
    </section>
  </main>

  <div id="chatInputArea" class="chat-input-area" style="display: none;">
    <textarea id="messageInput" placeholder="اكتب ما تبي..." rows="1"></textarea>
    <button id="sendBtn" class="btn send-btn">أرسل</button>
  </div>

  <div id="statusBar" class="status-bar" style="display: none;">
    <span>STATUS: <span id="status-text">READY</span></span>
    <span>LOUAY-AI: ONLINE</span>
  </div>

  <footer id="footerEl" style="display: none;">بوت لؤاي الذكي 💚 — حكي معه طبيعي!</footer>

  <script>
    const CORRECT_CODE = "55541";
    const loginScreen = document.getElementById('loginScreen');
    const codeInput = document.getElementById('codeInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('error');
    
    const chatHeader = document.getElementById('chatHeader');
    const chatMain = document.getElementById('chatMain');
    const chatInputArea = document.getElementById('chatInputArea');
    const statusBar = document.getElementById('statusBar');
    const footerEl = document.getElementById('footerEl');
    
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusText = document.getElementById('status-text');

    // Login logic
    loginBtn.addEventListener('click', checkCode);
    codeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkCode();
    });

    function checkCode() {
      const code = codeInput.value.trim();
      if (code === CORRECT_CODE) {
        loginScreen.classList.add('hidden');
        chatHeader.style.display = 'flex';
        chatMain.style.display = 'flex';
        chatInputArea.style.display = 'flex';
        statusBar.style.display = 'flex';
        footerEl.style.display = 'block';
        errorMsg.classList.remove('show');
        messageInput.focus();
        // Welcome message
        setTimeout(() => {
          addMessage('السلام عليكم يا لؤاي! 👋 أنا هنا بتاعك. شنوّ أخبارك؟ حكي معي بشكل طبيعي!', 'bot');
        }, 300);
      } else {
        errorMsg.classList.add('show');
        codeInput.value = '';
      }
    }

    // Logout logic
    logoutBtn.addEventListener('click', () => {
      loginScreen.classList.remove('hidden');
      chatHeader.style.display = 'none';
      chatMain.style.display = 'none';
      chatInputArea.style.display = 'none';
      statusBar.style.display = 'none';
      footerEl.style.display = 'none';
      codeInput.value = '';
      chatMessages.innerHTML = '';
      errorMsg.classList.remove('show');
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // Send message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      messageInput.value = '';
      messageInput.style.height = 'auto';

      showTypingIndicator();
      statusText.innerText = 'THINKING...';

      setTimeout(() => {
        const response = generateResponse(text);
        removeTypingIndicator();
        addMessage(response, 'bot');
        statusText.innerText = 'READY';
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 500 + Math.random() * 800);
    }

    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = sender === 'user' ? '👤' : '💚';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      chatMessages.appendChild(messageDiv);
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = '💚';

      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<span></span><span></span><span></span>';

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(typing);
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    // Intelligent response generator
    function generateResponse(userText) {
      const text = userText.toLowerCase().trim();

      // Greetings
      if (/^(سلام|السلام عليكم|مرحبا|هلا|هلو|السلام|Hi|Hello)/.test(text)) {
        return 'السلام عليكم! 👋 كيفك انت؟ شنوّ أخبارك يا لؤاي؟';
      }

      // Thanks
      if (/شكرا|تشكر|مشكور|ميرسي|شكر/.test(text)) {
        return 'العفو يا صديقي! 😊 أنا هنا دايما باش نساعدك!';
      }

      // Bye
      if (/^(مع السلامة|باي|باي بو|وداعا|خلاص|تمام)/.test(text)) {
        return 'مع السلامة يا لؤاي! 👋 باش حتاج شي حاجة عاود حكي معي!';
      }

      // How are you
      if (/شنوّ أخبارك|كيفك|كيفاش|وين الراح/.test(text)) {
        return 'الحمد لله تمام! 💚 أنا جاهز وفايق! وانت شنوّ أخبارك؟';
      }

      // Love/Nice
      if (/تحب|حب يك|كايح|حلو|ممتاز/.test(text)) {
        return 'شكراً يا لؤاي! 💚 أنت كذلك حلو وذكي! نتشتغلو معا بشكل حلو!';
      }

      // Name related
      if (/لؤاي|louay|only/.test(text)) {
        return 'أيوه! أنا هنا للؤاي! 💚 أنت الوحيد اللي أتكلم معاه!';
      }

      // Programming questions
      if (/كود|برمج|جافا|بايثون|html|css|function|variable/.test(text)) {
        return 'أنا فاهم في البرمجة بزاف! 💻 قول لي شنوّ المشكلة اللي واجهة وأنا نساعدك!';
      }

      // Need help
      if (/ساعدني|ساعد|حاجة|مشكلة|مساعدة/.test(text)) {
        return 'تمام! 💚 حط لي التفاصيل والمشكلة بالضبط وأنا نحاول نحلها معاك!';
      }

      // Default friendly response
      const responses = [
        'فاهم ما تقول! 👍 قول لي أكتر!',
        'هاك فكرة حلوة يا لؤاي! 💡 واصل!',
        'راني معاك! 🤝 شنوّ الباقي؟',
        'أحسن سؤال! 🎯 اشرح لي أكتر تاني!',
        'ممتاز! 😊 وشنوّ بعديها؟',
        'أنا فاهمك تمام! ✨ وبعديها؟',
        'كويس! 💚 تقدر تقول لي أكتر عن هاك؟',
        'يالا! شنوّ الخطوة التانية؟'
      ];
      return responses[Math.floor(Math.random() * responses.length)];
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
